name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-commit-files.mjs --tracked
      - run: pnpm run check
      - run: pnpm audit
      - name: Verify catalog and news delivery behavior
        run: node scripts/verify-behavior.mjs services
        env:
          WAVE_VERIFICATION_OUTPUT: ${{ runner.temp }}/wave-behavior
      - name: Upload sanitized behavior evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: service-behavior-failure
          path: ${{ runner.temp }}/wave-behavior
          if-no-files-found: ignore
          retention-days: 7

  playback-behavior:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify player lifecycle in sandboxed Electron
        run: node scripts/verify-behavior.mjs player
        env:
          WAVE_VERIFICATION_OUTPUT: ${{ runner.temp }}/wave-behavior
      - name: Upload sanitized behavior evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playback-behavior-failure
          path: ${{ runner.temp }}/wave-behavior
          if-no-files-found: ignore
          retention-days: 7
