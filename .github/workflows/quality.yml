name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-commit-files.mjs --tracked
      - run: pnpm run check
      - run: pnpm audit
      - name: Verify catalog and news delivery behavior
        run: node scripts/verify-behavior.mjs services
        env:
          WAVE_VERIFICATION_OUTPUT: ${{ runner.temp }}/wave-behavior
      - name: Upload sanitized behavior evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-behavior-failure
          path: ${{ runner.temp }}/wave-behavior
          if-no-files-found: ignore
          retention-days: 7

  playback-behavior:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify player lifecycle in sandboxed Electron
        run: node scripts/verify-behavior.mjs player
        env:
          WAVE_VERIFICATION_OUTPUT: ${{ runner.temp }}/wave-behavior
      - name: Verify packaged updater configuration
        run: pnpm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload sanitized behavior evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playback-behavior-failure
          path: ${{ runner.temp }}/wave-behavior
          if-no-files-found: ignore
          retention-days: 7

  close-to-tray:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify native close, restore, background audio, and Quit
        run: node docs/verification/close-to-tray/verify.mjs
        env:
          WAVE_VERIFICATION_OUTPUT: ${{ runner.temp }}/wave-tray
      - name: Upload sanitized tray evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: close-to-tray-${{ matrix.os }}
          path: ${{ runner.temp }}/wave-tray
          if-no-files-found: ignore
          retention-days: 7
