overrides:
  '@electron/get@^3.0.0>global-agent': 4.1.3
  # Upgrade the legacy callers before selecting minimatch's patched named-export API.
  '@electron/asar@3.4.1': 4.3.1
  '@electron/universal@2.0.3': 3.0.6
  'filelist@1.0.6': 2.0.2
  'minimatch@<11.0.1': 11.0.1
  '@electron/asar@4.3.1>glob': 14.0.2

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - electron-winstaller

# Oxlint hosts these plugins; they do not need the ESLint engine.
autoInstallPeers: false
peerDependencyRules:
  ignoreMissing:
    - eslint
    # The supported target is macOS; Squirrel is a Windows packaging backend.
    - electron-builder-squirrel-windows
