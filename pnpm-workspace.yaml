overrides:
  '@electron/get@^3.0.0>global-agent': 4.1.3

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - electron-winstaller

# Oxlint hosts these plugins; they do not need the ESLint engine.
autoInstallPeers: false
peerDependencyRules:
  ignoreMissing:
    - eslint
    # The supported target is macOS; Squirrel is a Windows packaging backend.
    - electron-builder-squirrel-windows
